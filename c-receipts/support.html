<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C Receipts Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75,700;100,400;100,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --grey: #6e615d;
      --orange: #f3735a;
      --tan: #ede4dc;
      --black: #000000;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Open Sans", sans-serif;
      font-weight: 400;
      color: var(--grey);
      background: var(--tan);
      line-height: 1.6;
    }
    header {
      background: var(--black);
      padding: 28px 24px;
      text-align: center;
    }
    header img {
      display: block;
      width: min(280px, 70vw);
      height: auto;
      margin: 0 auto;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    h1, h2 {
      font-family: "Open Sans", sans-serif;
      font-stretch: 75%;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--grey);
    }
    h1 { font-size: 1.35rem; margin: 0 0 1rem; }
    h2 { font-size: 1rem; margin: 2rem 0 0.75rem; }
    a { color: var(--orange); }
    nav {
      margin-top: 2.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Confluence">
  </header>
  <main>
    <h1>C Receipts Support</h1>
    <p>To contact the application developer of C Receipts, please reach out to <a href="mailto:IT@thinkconfluence.com">IT@thinkconfluence.com</a>.</p>
    <nav>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
